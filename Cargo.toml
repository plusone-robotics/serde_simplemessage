[package]
name = "simple_message"
version = "0.2.0"
categories = ["encoding", "parser-implementations"]
edition = "2024"
keywords = ["simplemessage", "serde", "serialization", "encoding"]
license = "Apache-2.0"
description = "A library for encoding and decoding SimpleMessage messages using serde."
repository = "https://github.com/plusone-robotics/serde_simplemessage"

[dependencies]
byteorder = "1.5.0"
num_enum = "0.7.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_repr = "0.1.20"
